networks:
  rag-network-v2:

services:
  api-oskar:
    build:
      dockerfile: ./api/Dockerfile
    restart: unless-stopped
    container_name: RAG-Annotations-API-siemens
    volumes:
      - ./api:/app
      - ./embeddings:/embeddings
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j-v2:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
    ports:
      - "9000:8000"
    networks:
      - rag-network-v2
    depends_on:
      - neo4j-v2

  neo4j-v2:
    image: neo4j:latest
    container_name: RAG-Annotations-NEO4J-v2
    ports:
      - "8484:7474"   # browser
      - "8687:7687"   # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
    volumes:
      - ./neo4j-data-cmd:/data
    networks:
      - rag-network-v2