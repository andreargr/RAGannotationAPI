networks:
  rag-network:

# To run this, you can either start the services one by one with the commands attached to them
# Or run docker compose up -d


services:

  # This service creates a FastAPI REST API service to query RAG
  # docker compose up api -d

  # To load embeddings:
  # 1. Start Neo4J container (docker compose up neo4j -d)
  # 2. Start API container (docker compose up api -d)
  # 3. Run the following command: docker compose exec api sh -c "cd /embeddings && python get_store_embeddings.py"    


  api:
    build:
      dockerfile: ./api/Dockerfile
    restart: unless-stopped
    container_name: RAG-Annotations-API
    volumes:
      - ./api:/app
      - ./embeddings:/embeddings
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    ports:
      - "8000:8000"
    networks:
      - rag-network

  # This service creates a Neo4J database
  # docker compose up neo4j -d

  neo4j:
    image: neo4j:latest
    container_name: RAG-Annotations-NEO4J
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - ./neo4j:/data
    networks:
      - rag-network


    

